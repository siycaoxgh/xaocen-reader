name: xaocen_reader
description: "XAOCEN Reader v4 - unified content reading & subscription platform (local-first)."
publish_to: 'none'

# 0.1.0-dev.3+3 — M3 纵向滚动 Reader + 精确位置恢复
version: 0.1.0-dev.3+3

environment:
  sdk: ^3.12.2

# M0 依赖集合（锁定于 2026-08-06）：
# - flutter_riverpod: 状态管理（第一版手写 Provider，不启用 codegen）
# - drift / sqlite3_flutter_libs: 数据库（Drift + SQLite；build_runner 仅 Drift 确有需要时使用）
# - path: 路径处理
# 不引入：RSS / 网络书源 / TTS / 同步 / 插件 / EPUB
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  drift: ^2.28.1
  sqlite3: ^2.9.0
  sqlite3_flutter_libs: ^0.5.36
  path: ^1.9.1
  crypto: ^3.0.6
  file_picker: ^11.0.3
  path_provider: ^2.1.6
  super_sliver_list: 0.4.1

# sqlite3 native assets hook：默认从 github.com 下载预编译库；
# 本环境 github.com 不可达（超时），改用 ghproxy.net 镜像。
# 参考 package:sqlite3/doc/hook.md 的 url_pattern user-define。
hooks:
  user_defines:
    sqlite3:
      source: sqlite3
      url_pattern: "https://ghproxy.net/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  drift_dev: ^2.28.1
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/encoding/
